name: Continuous Integration

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  automation-test-job:
    runs-on: ubuntu-latest

    steps:
      # 1. Upgrade checkout ke v4 (mendukung Node24)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Upgrade setup-node ke v4 dan set node-version ke 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Run E2E tests
        run: npm run ci:test

      - name: Build application
        run: npm run build
