name: Continuous Integration

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit/integration tests
        run: npm test

      - name: Run E2E tests
        run: npm run ci:test

      - name: Build application
        run: npm run build
